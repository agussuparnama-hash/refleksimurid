    function cekPesan() {
        const nisn = document.getElementById('nisn').value;
        const tgl = document.getElementById('tglLahir').value;
        const kunci = nisn + "_" + tgl;
        const hasil = document.getElementById('hasil');
        
        if(dataSiswa[kunci]) {
            document.getElementById('namaSiswa').innerText = dataSiswa[kunci].nama;
            document.getElementById('isiPesan').innerText = dataSiswa[kunci].pesan;
            hasil.style.display = 'block';
        } else {
            alert("Data tidak ditemukan. Pastikan NISN 10 digit dan Tanggal Lahir sudah benar.");
            hasil.style.display = 'none';
        }
    }
